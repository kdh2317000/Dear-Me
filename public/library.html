    <style>
        /* 중앙 컨텐츠 박스 레이아웃 통일 */
        .container {
            max-width: 800px;
            margin: 50px auto !important;
            padding: 50px 40px;
            background: white;
            border-radius: 30px;
            border: 3px solid #5c67f2;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            min-height: 350px;
            box-sizing: border-box;
        }

        .library-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #333;
        }

        .title-underline {
            border-bottom: 2px solid #f0f0ff;
            margin-bottom: 40px;
        }

        /* 명언 아이템 스타일 */
        .quote-item {
            background: #fff;
            padding: 35px 30px;
            margin-bottom: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 8px solid #5c67f2;
            position: relative;
            transition: transform 0.3s ease;
            text-align: center;
        }

        .quote-item:hover {
            transform: translateY(-5px);
        }

        .quote-text {
            font-size: 1.25rem;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 15px;
            padding: 0 40px;
            line-height: 1.5;
        }

        .quote-author {
            color: #888;
            font-size: 1rem;
        }

        /* 삭제 버튼 */
        .delete-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #eee;
            cursor: pointer;
            transition: color 0.2s;
            padding: 5px;
        }

        .delete-btn:hover {
            color: #ff5252;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            margin: 80px 0;
            font-size: 1.1rem;
            line-height: 1.6;
        }

<script>
// 깜빡임 방지용 즉시 실행 테마 적용 (노란색 플래시 제거)
(function(){
    var h = new Date().getHours();
    var c = (h>=6 && h<17) ? 'theme-morning' : (h>=17 && h<20) ? 'theme-evening' : 'theme-night';
    document.body.classList.add(c);
})();
</script>

    <div class="container">
        <h2 class="library-title"><span>⭐</span> 저장한 명언 목록</h2>
        <div class="title-underline"></div>
        <div id="library-list"></div>
    </div>

    <script>
        window.onload = function () {
            const loginUser = sessionStorage.getItem('loginUser');
            if (loginUser) {
                document.getElementById('menu-login').style.display = 'none';
                document.getElementById('menu-logout').style.display = 'block';

                loadLibrary(loginUser);  // 저장한 명언 로드
            } else {
                alert("로그인이 필요한 페이지입니다.");
                location.href = "/login";
            }
        };

        // 저장한 추천 명언 로드
        function loadLibrary(username) {
            fetch(`/api/my-library?username=${username}`)
                .then(res => res.json())
                .then(data => {
                    const listDiv = document.getElementById('library-list');
                    if (!data || data.length === 0) {
                        listDiv.innerHTML = '<p class="empty-msg">아직 저장된 명언이 없어요. <br>추천 메뉴에서 마음에 드는 명언의 하트를 눌러보세요! ⭐</p>';
                        return;
                    }

                    let html = "";
                    data.forEach(item => {
                        const safeText = item.text.replace(/'/g, "\\'");
                        html += `
                            <div class="quote-item">
                                <button class="delete-btn" onclick="deleteQuote('${safeText}')" title="삭제">✖</button>
                                <span class="quote-text">"${item.text}"</span>
                                <span class="quote-author">- ${item.author} -</span>
                            </div>
                        `;
                    });
                    listDiv.innerHTML = html;
                })
                .catch(err => console.error("보관함 로드 실패:", err));
        }

        // 명언 삭제 함수
        function deleteQuote(text) {
            const loginUser = sessionStorage.getItem('loginUser');
            if (!confirm("이 명언을 보관함에서 삭제할까요?")) return;

            fetch('/api/remove-from-library', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: loginUser, text: text })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert("삭제에 실패했습니다.");
                    }
                });
        }

        // 로그아웃 함수
        function logout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                sessionStorage.removeItem('loginUser');
                location.href = "/";
            }
        }
    </script>


<!-- Global Auth Security & Heartbeat (Injected) -->
<script>
(function() {
    const u = sessionStorage.getItem('loginUser');
    if (u) {
        // 즉시 세션 유효성 검사 (서버 재실행 등 감지)
        fetch('/api/heartbeat?username=' + encodeURIComponent(u))
        .then(res => res.json())
        .then(data => {
            if(!data.success) {
                sessionStorage.removeItem('loginUser');
                alert("세션이 만료되었거나 서버가 재시작되었습니다. 다시 로그인해주세요.");
                location.href = "/login";
            }
        }).catch(()=>{});

        // 20초마다 생존 신고
        setInterval(() => {
            fetch('/api/heartbeat?username=' + encodeURIComponent(u))
            .then(res => res.json())
            .then(data => {
                if(!data.success) {
                    sessionStorage.removeItem('loginUser');
                    alert("세션이 만료되었습니다.");
                    location.href = "/login";
                }
            }).catch(()=>{});
        }, 3000);
    }
    window.logout = function() {
        if (confirm("로그아웃 하시겠습니까?")) {
            const currentUser = sessionStorage.getItem('loginUser');
            if (currentUser) {
                fetch('/api/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: currentUser})
                }).then(() => {
                    sessionStorage.removeItem('loginUser');
                    alert("정상적으로 로그아웃 되었습니다.");
                    location.href = "/";
                }).catch(() => {
                    sessionStorage.removeItem('loginUser');
                    location.href = "/";
                });
            } else {
                location.href = "/";
            }
        }
    };
})();
</script>









<!-- 시간대별 고급 파티클 테마 및 글로우 효과 -->
<canvas id="themeCanvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;"></canvas>
<script>
(function() {
    function applyBodyTheme(hour) {
        document.body.classList.remove('theme-morning', 'theme-evening', 'theme-night');
        if (hour >= 6 && hour < 17) {
            document.body.classList.add('theme-morning');
        } else if (hour >= 17 && hour < 20) {
            document.body.classList.add('theme-evening');
        } else {
            document.body.classList.add('theme-night');
        }
    }

    const canvas = document.getElementById('themeCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let currentHour = new Date().getHours();
    
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function initParticles() {
        particles = [];
        let count = 0;
        let isNight = currentHour >= 20 || currentHour < 6;
        let isEve = currentHour >= 17 && currentHour < 20;
        let isMorning = currentHour >= 6 && currentHour < 17;

        if (isMorning) count = 80; // 아침: 부유하는 먼지/햇살
        else if (isEve) count = 50; // 저녁: 따뜻한 주황빛 입자
        else count = 120; // 밤: 별처럼 많은 수 (기존 유지)

        for (let i = 0; i < count; i++) {
            particles.push(createParticle(isNight, isEve, isMorning));
        }
    }

    function createParticle(isNight, isEve, isMorning) {
        let size, speedX, speedY, color, twinkleSpeed, maxAlpha;
        if (isMorning) {
            // 아침: 먼지 느낌, 매우 연하고 작고 느리게 이동
            size = Math.random() * 1.5 + 0.5;
            speedX = (Math.random() - 0.5) * 0.15; // 좌우 아주 약간
            speedY = Math.random() * 0.2 + 0.05; // 부유하며 살짝 내려감
            color = '255, 255, 255'; 
            twinkleSpeed = Math.random() * 0.005 + 0.002;
            maxAlpha = Math.random() * 0.3 + 0.1; // 최대 조차도 흐릿함
        } else if (isEve) {
            // 저녁: 따뜻한 주황빛 퍼짐과 어울리는 입자, 좌에서 우로 약간 번지듯 이동
            size = Math.random() * 2.5 + 1;
            speedX = Math.random() * 0.3 + 0.1; // 왼쪽에서 퍼져나가는 속도
            speedY = (Math.random() - 0.5) * 0.2 - 0.05; 
            color = '255, ' + Math.floor(Math.random() * 100 + 120) + ', 50'; // 따뜻한 주황/노랑
            twinkleSpeed = Math.random() * 0.01 + 0.005;
            maxAlpha = Math.random() * 0.6 + 0.2;
        } else {
            // 밤: 유지 (미세한 별빛)
            size = Math.random() * 1.5;
            speedX = (Math.random() - 0.5) * 0.1;
            speedY = (Math.random() - 0.5) * 0.1;
            color = '255, 255, 255';
            twinkleSpeed = Math.random() * 0.02 + 0.005;
            maxAlpha = Math.random() * 0.8 + 0.2;
        }
        return { 
            x: Math.random() * width, 
            y: Math.random() * height, 
            size, speedX, speedY, color, twinkleSpeed, maxAlpha, 
            alpha: Math.random() * maxAlpha, 
            alphaDir: Math.random() > 0.5 ? 1 : -1 
        };
    }

    function drawParticles() {
        ctx.clearRect(0, 0, width, height);
        let isEve = currentHour >= 17 && currentHour < 20;

        particles.forEach(p => {
            p.alpha += p.twinkleSpeed * p.alphaDir;
            if (p.alpha > p.maxAlpha) { p.alpha = p.maxAlpha; p.alphaDir = -1; }
            if (p.alpha < 0) { p.alpha = 0; p.alphaDir = 1; }
            
            p.x += p.speedX;
            p.y += p.speedY;
            
            if (p.x < -20) p.x = width + 20;
            if (p.x > width + 20) p.x = -20;
            if (p.y < -20) p.y = height + 20;
            if (p.y > height + 20) p.y = -20;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
            
            // 저녁에는 자체 글로우 (은은한 퍼짐 극대화)
            if (isEve) {
                ctx.shadowBlur = p.size * 2;
                ctx.shadowColor = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.fill();
        });
        requestAnimationFrame(drawParticles);
    }

    applyBodyTheme(currentHour);
    initParticles();
    drawParticles();

    setInterval(() => {
        let newHour = new Date().getHours();
        if (newHour !== currentHour) {
            currentHour = newHour;
            applyBodyTheme(currentHour);
            initParticles();
        }
    }, 60000);
})();
</script>
