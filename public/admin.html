<head>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="manifest" href="/manifest.json">

    <style>
        .container { max-width: 1000px; }
        .feedback-table { width: 100%; border-collapse: collapse; margin-top: 30px; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .feedback-table th, .feedback-table td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .feedback-table th { background: #5c67f2; color: white; font-weight: bold; }
        .feedback-table tr:hover { background: #f9faff; }
        .time { font-size: 0.85rem; color: #999; }
        .user-id { font-weight: bold; color: #5c67f2; }
    </style>

<body>

<script>
// 깜빡임 방지용 즉시 실행 테마 적용 (노란색 플래시 제거)
(function(){
    var h = new Date().getHours();
    var c = (h>=6 && h<17) ? 'theme-morning' : (h>=17 && h<20) ? 'theme-evening' : 'theme-night';
    document.body.classList.add(c);
})();
</script>

    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">Dear Me 관리자</h1>
            <ul class="nav-menu">
                <li><a href="/">홈으로 가기</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2>📩 사용자 피드백 관리</h2>
        <p>우리 서비스 주주(사용자)님들이 남겨주신 소중한 의견입니다.</p>

        <table class="feedback-table">
            <thead>
                <tr>
                    <th>보낸 이</th>
                    <th>내용</th>
                    <th>일시</th>
                </tr>
            </thead>
            <tbody id="feedback-list">
                <!-- 피드백 목록이 여기에 뜹니다 -->
            </tbody>
        </table>
    </div>

    <script>
        window.onload = function() {
            fetch('/api/admin/feedbacks')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('feedback-list');
                    if (data.length === 0) {
                        list.innerHTML = '<tr><td colspan="3" style="text-align:center;">아직 도착한 피드백이 없습니다.</td></tr>';
                        return;
                    }

                    data.forEach(fb => {
                        const row = `
                            <tr>
                                <td class="user-id">${fb.username}</td>
                                <td>${fb.content}</td>
                                <td class="time">${new Date(fb.created_at).toLocaleString()}</td>
                            </tr>
                        `;
                        list.innerHTML += row;
                    });
                });
        };
    </script>


<!-- Global Auth Security & Heartbeat (Injected) -->
<script>
(function() {
    const u = sessionStorage.getItem('loginUser');
    if (u) {
        // 즉시 세션 유효성 검사 (서버 재실행 등 감지)
        fetch('/api/heartbeat?username=' + encodeURIComponent(u))
        .then(res => res.json())
        .then(data => {
            if(!data.success) {
                sessionStorage.removeItem('loginUser');
                alert("세션이 만료되었거나 서버가 재시작되었습니다. 다시 로그인해주세요.");
                location.href = "/login";
            }
        }).catch(()=>{});

        // 20초마다 생존 신고
        setInterval(() => {
            fetch('/api/heartbeat?username=' + encodeURIComponent(u))
            .then(res => res.json())
            .then(data => {
                if(!data.success) {
                    sessionStorage.removeItem('loginUser');
                    alert("세션이 만료되었습니다.");
                    location.href = "/login";
                }
            }).catch(()=>{});
        }, 3000);
    }
    window.logout = function() {
        if (confirm("로그아웃 하시겠습니까?")) {
            const currentUser = sessionStorage.getItem('loginUser');
            if (currentUser) {
                fetch('/api/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: currentUser})
                }).then(() => {
                    sessionStorage.removeItem('loginUser');
                    alert("정상적으로 로그아웃 되었습니다.");
                    location.href = "/";
                }).catch(() => {
                    sessionStorage.removeItem('loginUser');
                    location.href = "/";
                });
            } else {
                location.href = "/";
            }
        }
    };
})();
</script>









<!-- 시간대별 고급 파티클 테마 및 글로우 효과 -->
<canvas id="themeCanvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;"></canvas>
<script>
(function() {
    function applyBodyTheme(hour) {
        document.body.classList.remove('theme-morning', 'theme-evening', 'theme-night');
        if (hour >= 6 && hour < 17) {
            document.body.classList.add('theme-morning');
        } else if (hour >= 17 && hour < 20) {
            document.body.classList.add('theme-evening');
        } else {
            document.body.classList.add('theme-night');
        }
    }

    const canvas = document.getElementById('themeCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let currentHour = new Date().getHours();
    
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function initParticles() {
        particles = [];
        let count = 0;
        let isNight = currentHour >= 20 || currentHour < 6;
        let isEve = currentHour >= 17 && currentHour < 20;
        let isMorning = currentHour >= 6 && currentHour < 17;

        if (isMorning) count = 80; // 아침: 부유하는 먼지/햇살
        else if (isEve) count = 50; // 저녁: 따뜻한 주황빛 입자
        else count = 120; // 밤: 별처럼 많은 수 (기존 유지)

        for (let i = 0; i < count; i++) {
            particles.push(createParticle(isNight, isEve, isMorning));
        }
    }

    function createParticle(isNight, isEve, isMorning) {
        let size, speedX, speedY, color, twinkleSpeed, maxAlpha;
        if (isMorning) {
            // 아침: 먼지 느낌, 매우 연하고 작고 느리게 이동
            size = Math.random() * 1.5 + 0.5;
            speedX = (Math.random() - 0.5) * 0.15; // 좌우 아주 약간
            speedY = Math.random() * 0.2 + 0.05; // 부유하며 살짝 내려감
            color = '255, 255, 255'; 
            twinkleSpeed = Math.random() * 0.005 + 0.002;
            maxAlpha = Math.random() * 0.3 + 0.1; // 최대 조차도 흐릿함
        } else if (isEve) {
            // 저녁: 따뜻한 주황빛 퍼짐과 어울리는 입자, 좌에서 우로 약간 번지듯 이동
            size = Math.random() * 2.5 + 1;
            speedX = Math.random() * 0.3 + 0.1; // 왼쪽에서 퍼져나가는 속도
            speedY = (Math.random() - 0.5) * 0.2 - 0.05; 
            color = '255, ' + Math.floor(Math.random() * 100 + 120) + ', 50'; // 따뜻한 주황/노랑
            twinkleSpeed = Math.random() * 0.01 + 0.005;
            maxAlpha = Math.random() * 0.6 + 0.2;
        } else {
            // 밤: 유지 (미세한 별빛)
            size = Math.random() * 1.5;
            speedX = (Math.random() - 0.5) * 0.1;
            speedY = (Math.random() - 0.5) * 0.1;
            color = '255, 255, 255';
            twinkleSpeed = Math.random() * 0.02 + 0.005;
            maxAlpha = Math.random() * 0.8 + 0.2;
        }
        return { 
            x: Math.random() * width, 
            y: Math.random() * height, 
            size, speedX, speedY, color, twinkleSpeed, maxAlpha, 
            alpha: Math.random() * maxAlpha, 
            alphaDir: Math.random() > 0.5 ? 1 : -1 
        };
    }

    function drawParticles() {
        ctx.clearRect(0, 0, width, height);
        let isEve = currentHour >= 17 && currentHour < 20;

        particles.forEach(p => {
            p.alpha += p.twinkleSpeed * p.alphaDir;
            if (p.alpha > p.maxAlpha) { p.alpha = p.maxAlpha; p.alphaDir = -1; }
            if (p.alpha < 0) { p.alpha = 0; p.alphaDir = 1; }
            
            p.x += p.speedX;
            p.y += p.speedY;
            
            if (p.x < -20) p.x = width + 20;
            if (p.x > width + 20) p.x = -20;
            if (p.y < -20) p.y = height + 20;
            if (p.y > height + 20) p.y = -20;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
            
            // 저녁에는 자체 글로우 (은은한 퍼짐 극대화)
            if (isEve) {
                ctx.shadowBlur = p.size * 2;
                ctx.shadowColor = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.fill();
        });
        requestAnimationFrame(drawParticles);
    }

    applyBodyTheme(currentHour);
    initParticles();
    drawParticles();

    setInterval(() => {
        let newHour = new Date().getHours();
        if (newHour !== currentHour) {
            currentHour = newHour;
            applyBodyTheme(currentHour);
            initParticles();
        }
    }, 60000);
})();
</script>

</body>
