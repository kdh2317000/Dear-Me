<html lang="ko">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#5c67f2">

    <link rel="apple-touch-icon" href="/icon.svg">

    <title>Dear Me - 짱구 도감</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
        }

        .collection-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
        }

        .header-title {
            text-align: center;
            color: #0369a1;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 900;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.5);
        }

        .header-subtitle {
            text-align: center;
            color: #0c4a6e;
            font-size: 1rem;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .pokedex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        .poke-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }

        .poke-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .poke-card.locked {
            filter: grayscale(1) opacity(0.5);
        }

        .poke-card.locked:hover {
            filter: grayscale(0.5) opacity(0.8);
        }

        .poke-card.locked .poke-icon svg * {
            fill: #cbd5e1 !important;
            stroke: #cbd5e1 !important;
        }

        .poke-number {
            font-size: 0.7rem;
            color: #0369a1;
            font-weight: 800;
            margin-bottom: 8px;
            background: rgba(3, 105, 161, 0.1);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .poke-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poke-icon svg {
            width: 100%;
            height: 100%;
        }

        .poke-name {
            font-size: 0.95rem;
            font-weight: 800;
            color: #334155;
            margin-bottom: 5px;
        }

        .poke-status {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 50px;
            font-weight: 700;
            display: inline-block;
        }

        .status-done {
            background: #dcfce7;
            color: #166534;
        }

        .status-lock {
            background: #f1f5f9;
            color: #64748b;
        }

        /* 배경 장식 */
        .bg-blob {
            position: fixed;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
        }

        /* 통계 카드 레이아웃 */
        .collection-stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 2.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 190px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .stat-icon {
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 800;
            margin-bottom: 2px;
            letter-spacing: -0.02em;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            line-height: 1.1;
        }

        #totalCount {
            color: #0284c7;
        }

        #collectedCount {
            color: #16a34a;
        }

        #remainingCount {
            color: #ea580c;
        }

        /* 펫 모달 스타일 (냥코 대전쟁 테마) */
        .pet-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .pet-modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .pet-modal-content {
            background: #252422;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pet-modal-overlay.active .pet-modal-content {
            transform: scale(1);
        }

        .pet-modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .pet-modal-close:hover {
            background: rgba(239, 68, 68, 0.8);
        }

        /* 펫 큰 이미지 뷰 영역 (냥코 대전쟁 스타일 그린 격자) */
        .pet-modal-view {
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #6ecea6;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent);
            background-size: 30px 30px;
            border-bottom: 4px solid #1a1a1a;
        }

        .pet-modal-view svg {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.15));
            transition: transform 0.3s ease;
        }

        .pet-modal-view svg:hover {
            transform: scale(1.05);
        }

        /* 진화 단계 선택 버튼 그룹 */
        .pet-evolution-steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px;
            background: #1e1e1c;
            border-bottom: 2px solid #111;
        }

        .pet-evo-btn {
            background: #2b2b28;
            border: 2px solid #3d3d3a;
            border-radius: 8px;
            padding: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #888;
        }

        .pet-evo-btn.active {
            background: #6ecea6;
            border-color: #fff;
            color: #111;
            box-shadow: 0 0 10px rgba(110, 206, 166, 0.4);
        }

        .pet-evo-btn.active svg {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .pet-evo-btn svg {
            width: 36px;
            height: 36px;
            margin-bottom: 4px;
        }

        .pet-evo-label {
            font-size: 0.65rem;
            font-weight: bold;
        }

        .pet-evo-btn.active .pet-evo-label {
            color: #111;
        }

        /* 상세 스토리 영역 (레트로 다크/우드 스타일) */
        .pet-story-box {
            background: #181512;
            padding: 16px;
            border: 4px double #8d7a66;
            margin: 12px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace, 'Outfit', sans-serif;
        }

        .pet-story-title {
            color: #e5d1b8;
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(229, 209, 184, 0.3);
            padding-bottom: 6px;
        }

        .pet-story-content {
            color: #cbbca9;
            font-size: 0.85rem;
            line-height: 1.6;
            min-height: 80px;
            word-break: keep-all;
        }
    
        /* 짱구 패밀리 이미지 최적화 스타일 */
        .poke-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .poke-card:hover .poke-icon img {
            border-color: #cbd5e1;
            transform: scale(1.05);
        }
        .pet-modal-view img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 20px;
            border: 3.5px solid #1a1a1a;
            box-shadow: 0 12px 36px rgba(0,0,0,0.25);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .pet-modal-view img:hover {
            transform: scale(1.05);
        }
        .pet-evo-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .pet-evo-btn.active img {
            border-color: #fff;
        }
</style>

</head>

        const loginUser = sessionStorage.getItem('loginUser');

        async function initPokedex() {
            if (!loginUser) {
                alert("로그인이 필요합니다.");
                location.href = "/login";
                return;
            }

            try {
                const res = await fetch(`/api/pet/completed/${encodeURIComponent(loginUser)}`);
                const data = await res.json();
                const completedTypes = data.completed || [];

                renderPokedex(completedTypes);
            } catch (e) {
                console.error(e);
                renderPokedex([]);
            }
        }

        function renderPokedex(completedTypes) {
            const grid = document.getElementById('pokedexGrid');
            grid.innerHTML = '';

            const types = Object.keys(ANIMAL_DEFS);
            const totalAnimals = types.length;
            const uniqueCompleted = [...new Set(completedTypes)].filter(type => types.includes(type));
            const collectedCount = uniqueCompleted.length;
            const remainingCount = totalAnimals - collectedCount;

            document.getElementById('totalCount').textContent = totalAnimals;
            document.getElementById('collectedCount').textContent = collectedCount;
            document.getElementById('remainingCount').textContent = remainingCount;
            types.forEach((type, index) => {
                const def = ANIMAL_DEFS[type];
                const isCompleted = completedTypes.includes(type);
                const number = (index + 1).toString().padStart(3, '0');

                const card = document.createElement('div');
                card.className = `poke-card ${isCompleted ? 'completed' : 'locked'}`;

                // 마지막 단계 SVG (졸업 모습)
                const svgCode = PET_SVGS[type][3];

                card.innerHTML = `
                    <div class="poke-number">#${number}</div>
                    <div class="poke-icon">${svgCode}</div>
                    <div class="poke-name">${def.name}</div>
                    <div class="poke-status ${isCompleted ? 'status-done' : 'status-lock'}">
                        ${isCompleted ? '성장 완료' : '미발견'}
                    </div>
                `;

                // 클릭 시 모달 오픈 혹은 미발견 알림
                card.onclick = () => {
                    if (isCompleted) {
                        openPetModal(type);
                    } else {
                        alert("아직 발견하지 못한 캐릭터입니다. 끝까지 성장시켜 도감을 잠금 해제해 보세요!");
                    }
                };

                grid.appendChild(card);
            });
        }

        // 모달 상태 제어 변수
        let activePetType = null;
        let activeStage = 3; // 기본 Lv.4 (마지막 단계)

        function openPetModal(type) {
            activePetType = type;
            activeStage = 3; // 기본적으로 Lv.4 단계로 모달 열기

            const modal = document.getElementById('petModal');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('active');
            }, 10);

            renderModalContent();
        }

        function closePetModal() {
            const modal = document.getElementById('petModal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function handleOverlayClick(event) {
            if (event.target.id === 'petModal') {
                closePetModal();
            }
        }

        function changeModalStage(stageIndex) {
            activeStage = stageIndex;
            renderModalContent();
        }

        function renderModalContent() {
            if (!activePetType) return;
            const def = ANIMAL_DEFS[activePetType];
            const svgs = PET_SVGS[activePetType];

            // 1. 대형 뷰포트에 현재 단계 SVG 출력
            const view = document.getElementById('modalView');
            view.innerHTML = svgs[activeStage];

            // 2. 진화 단계 버튼들 목록 구성
            const steps = document.getElementById('modalEvoSteps');
            steps.innerHTML = '';

            const stageLabels = ["Lv.1 베이비", "Lv.2 성장기", "Lv.3 청소년기", "Lv.4 졸업형태"];
            for (let i = 0; i < 4; i++) {
                const btn = document.createElement('button');
                btn.className = `pet-evo-btn ${i === activeStage ? 'active' : ''}`;
                btn.onclick = () => changeModalStage(i);

                btn.innerHTML = `
                    <div style="width:24px; height:24px; display:flex; align-items:center; justify-content:center; transform:scale(0.8);">${svgs[i]}</div>
                    <span class="pet-evo-label">${stageLabels[i]}</span>
                `;
                steps.appendChild(btn);
            }

            // 3. 스토리/소개글 출력
            const storyTitle = document.getElementById('modalStoryTitle');
            const storyContent = document.getElementById('modalStoryContent');

            storyTitle.textContent = `【 ${def.name} 】 ( ${def.subType || '캐릭터'} )`;
            storyContent.innerHTML = (def.story || '상세 소개글이 아직 구성되지 않았습니다.').replace(/\n/g, '<br>');
        }

        initPokedex();

        function logout() {
            sessionStorage.clear();
            location.href = '/login';
        }
