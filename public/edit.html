<body>

            document.body.classList.add(c);
        })();
    </script>

    <div class="main-wrapper">
        <div class="content-box">
            <div class="editor-header">
                <input type="text" id="postTitle" class="title-input" placeholder="제목을 입력해주세요.">
                <div id="adminNoticeArea" style="display: none; margin-top: 15px;">

                    </label>
                </div>
            </div>

            <div class="editor-toolbar">
                <span class="tool-item" id="btn-bold" onmousedown="handleToolClick(event, 'bold')"><i
                        class="fa-solid fa-bold"></i></span>
                <span class="tool-item" id="btn-underline" onmousedown="handleToolClick(event, 'underline')"><i
                        class="fa-solid fa-underline"></i></span>
                <span class="tool-item" id="btn-strike" onmousedown="handleToolClick(event, 'strikeThrough')"><i

                <div class="tool-item" onmousedown="event.preventDefault(); togglePalette(event);">

                            <div class="color-box" style="background: #f1c40f;"
                                onmousedown="handleColorClick(event, '#f1c40f')"></div>
                            <div class="color-box" style="background: #27ae60;"
                                onmousedown="handleColorClick(event, '#27ae60')"></div>
                            <div class="color-box" style="background: #0ea5e9;"
                                onmousedown="handleColorClick(event, '#0ea5e9')"></div>
                            <div class="color-box" style="background: #00008B;"
                                onmousedown="handleColorClick(event, '#00008B')"></div>
                            <div class="color-box" style="background: #8b5cf6;"
                                onmousedown="handleColorClick(event, '#8b5cf6')"></div>

            <div id="postContent" class="content-editor" contenteditable="true" onkeyup="updateUI()"

    <script>
        const editor = document.getElementById('postContent');
        const postId = window.location.pathname.split('/').pop();
        const loginUser = sessionStorage.getItem('loginUser');
        let selectedFileTag = null;

        // [1] 서버에서 원래 글 내용 가져와서 칸에 채워넣기
        async function loadOriginal() {
            try {
                const res = await fetch(`/api/board/post/${postId}?isListView=true`);
                const data = await res.json();
                if (data && data.length > 0) {
                    document.getElementById('postTitle').value = data[0].title;
                    editor.innerHTML = data[0].content; // HTML 서식 그대로 복원

                    // 기존 손상된 인라인 onclick 속성 제거
                    editor.querySelectorAll('.attached-file-tag').forEach(tag => {
                        const aTag = tag.tagName === 'A' ? tag : tag.querySelector('a');
                        if (aTag) {
                            aTag.removeAttribute('onclick');
                        }
                    });

                    if (loginUser === 'admin' || loginUser === '관리자') {
                        document.getElementById('adminNoticeArea').style.display = 'block';
                        if (data[0].is_notice) document.getElementById('isNoticeCheckbox').checked = true;
                    }
                    convertOldFileTags();
                }
            } catch (err) { console.error("원본 로딩 실패:", err); }
        }

        function convertOldFileTags() {
            const tags = editor.querySelectorAll('a.attached-file-tag');
            tags.forEach(tag => {
                if (tag.tagName === 'A' && !tag.parentElement.classList.contains('attached-file-tag')) {
                    const span = document.createElement('span');
                    span.className = 'attached-file-tag';
                    span.setAttribute('contenteditable', 'false');
                    
                    const newA = tag.cloneNode(true);
                    newA.classList.remove('attached-file-tag');
                    
                    const deleteBtn = document.createElement('span');
                    deleteBtn.className = 'delete-file-btn';
                    deleteBtn.innerHTML = '&times;';
                    deleteBtn.addEventListener('click', (e) => {
                        span.remove();
                        e.stopPropagation();
                    });
                    
                    span.appendChild(newA);
                    span.appendChild(deleteBtn);
                    
                    tag.parentNode.replaceChild(span, tag);
                }
            });
        }

        // [2] 수정 완료 버튼 눌렀을 때 서버로 보내기
        async function updatePost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = editor.innerHTML;
            const isNoticeCheckbox = document.getElementById('isNoticeCheckbox');
            const is_notice = isNoticeCheckbox && isNoticeCheckbox.checked ? true : false;

            if (!title || !content || content === '<br>') return alert("제목과 내용을 모두 입력해주세요!");

            try {
                const res = await fetch(`/api/board/post/${postId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content, is_notice })
                });
                if (res.ok) {
                    alert("성공적으로 수정되었습니다! ✨");
                    location.href = '/board/view/' + postId;
                } else {
                    alert("수정에 실패했습니다.");
                }
            } catch (err) { alert("서버와 통신할 수 없습니다."); }
        }

        // --- 에디터 도구 기능들 ---
        function handleToolClick(e, command) { e.preventDefault(); document.execCommand(command, false, null); updateUI(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const fileTag = `<span class="attached-file-tag" contenteditable="false"><a href="${e.target.result}"><i class="fa-solid fa-paperclip"></i>${file.name}</a><span class="delete-file-btn" onclick="this.parentElement.remove(); event.stopPropagation();">&times;</span></span>&nbsp;`;
                    editor.focus();
                    document.execCommand('insertHTML', false, fileTag);
                };
                reader.readAsDataURL(file);
            }
        }

        function selectFileTag(tag, e) {
            if (selectedFileTag) selectedFileTag.classList.remove('selected');
            selectedFileTag = tag;
            selectedFileTag.classList.add('selected');
            if (e) e.stopPropagation();
        }

        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedFileTag) {
                    e.preventDefault(); 
                    selectedFileTag.remove(); 
                    selectedFileTag = null;
                }
            }
        });

        function handleEditorClick(e) {
            const fileTag = e.target.closest('.attached-file-tag');
            if (fileTag) {
                const deleteBtn = e.target.closest('.delete-file-btn');
                if (!deleteBtn) {
                    e.preventDefault();
                    selectFileTag(fileTag, e);
                    
                    const aTag = fileTag.tagName === 'A' ? fileTag : fileTag.querySelector('a');
                    if (aTag) {
                        const imgData = aTag.getAttribute('href');
                        if (imgData) {
                            const viewer = window.open("");
                            viewer.document.write(`<html><body style="margin:0; background:#111; display:flex; justify-content:center; align-items:center; min-height:100vh;"><img src="${imgData}" style="max-width:100%; max-height:100vh; cursor:zoom-out;" onclick="window.close()"></body></html>`);
                        }
                    }
                }
            } else {
                if (selectedFileTag) {
                    selectedFileTag.classList.remove('selected');
                    selectedFileTag = null;
                }
            }
            updateUI();
        }

        function handleColorClick(e, color) {
            e.preventDefault(); e.stopPropagation();
            document.execCommand('foreColor', false, color);
            document.getElementById('colorIndicator').style.backgroundColor = color;
            document.getElementById('colorPalette').classList.remove('active');
        }

        function togglePalette(e) { e.stopPropagation(); document.getElementById('colorPalette').classList.toggle('active'); }

        function handleLinkClick(e) {
            e.preventDefault();
            const url = prompt("링크 주소를 입력하세요:", "https://");
            if (url) document.execCommand('createLink', false, url);
        }

        function updateUI() {
            const actions = [{ id: 'btn-bold', cmd: 'bold' }, { id: 'btn-underline', cmd: 'underline' }, { id: 'btn-strike', cmd: 'strikeThrough' }];
            actions.forEach(action => {
                const btn = document.getElementById(action.id);
                if (btn) {
                    if (document.queryCommandState(action.cmd)) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });
        }

        document.addEventListener('click', (e) => {
            const palette = document.getElementById('colorPalette');
            if (palette && !e.target.closest('.tool-item')) {
                palette.classList.remove('active');
            }
        });

        loadOriginal();
    </script>


    <!-- Global Auth Security & Heartbeat (Injected) -->
    <script>
        (function () {
            const u = sessionStorage.getItem('loginUser');
            if (u) {
                // 즉시 세션 유효성 검사 (서버 재실행 등 감지)
                fetch('/api/heartbeat?username=' + encodeURIComponent(u))
                    .then(res => res.json())
                    .then(data => {
                        if (!data.success) {
                            sessionStorage.removeItem('loginUser');
                            alert("세션이 만료되었거나 서버가 재시작되었습니다. 다시 로그인해주세요.");
                            location.href = "/login";
                        }
                    }).catch(() => { });

                // 20초마다 생존 신고
                setInterval(() => {
                    fetch('/api/heartbeat?username=' + encodeURIComponent(u))
                        .then(res => res.json())
                        .then(data => {
                            if (!data.success) {
                                sessionStorage.removeItem('loginUser');
                                alert("세션이 만료되었습니다.");
                                location.href = "/login";
                            }
                        }).catch(() => { });
                }, 3000);
            }
            window.logout = function () {
                if (confirm("로그아웃 하시겠습니까?")) {
                    const currentUser = sessionStorage.getItem('loginUser');
                    if (currentUser) {
                        fetch('/api/logout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: currentUser })
                        }).then(() => {
                            sessionStorage.removeItem('loginUser');
                            alert("정상적으로 로그아웃 되었습니다.");
                            location.href = "/";
                        }).catch(() => {
                            sessionStorage.removeItem('loginUser');
                            location.href = "/";
                        });
                    } else {
                        location.href = "/";
                    }
                }
            };
        })();
    </script>









    <!-- 시간대별 고급 파티클 테마 및 글로우 효과 -->
    <canvas id="themeCanvas"
        style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;"></canvas>
    <script>
        (function () {
            function applyBodyTheme(hour) {
                document.body.classList.remove('theme-morning', 'theme-evening', 'theme-night');
                if (hour >= 6 && hour < 17) {
                    document.body.classList.add('theme-morning');
                } else if (hour >= 17 && hour < 20) {
                    document.body.classList.add('theme-evening');
                } else {
                    document.body.classList.add('theme-night');
                }
            }

            const canvas = document.getElementById('themeCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let currentHour = new Date().getHours();

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function initParticles() {
                particles = [];
                let count = 0;
                let isNight = currentHour >= 20 || currentHour < 6;
                let isEve = currentHour >= 17 && currentHour < 20;
                let isMorning = currentHour >= 6 && currentHour < 17;

                if (isMorning) count = 80; // 아침: 부유하는 먼지/햇살
                else if (isEve) count = 50; // 저녁: 따뜻한 주황빛 입자
                else count = 120; // 밤: 별처럼 많은 수 (기존 유지)

                for (let i = 0; i < count; i++) {
                    particles.push(createParticle(isNight, isEve, isMorning));
                }
            }

            function createParticle(isNight, isEve, isMorning) {
                let size, speedX, speedY, color, twinkleSpeed, maxAlpha;
                if (isMorning) {
                    // 아침: 먼지 느낌, 매우 연하고 작고 느리게 이동
                    size = Math.random() * 1.5 + 0.5;
                    speedX = (Math.random() - 0.5) * 0.15; // 좌우 아주 약간
                    speedY = Math.random() * 0.2 + 0.05; // 부유하며 살짝 내려감
                    color = '255, 255, 255';
                    twinkleSpeed = Math.random() * 0.005 + 0.002;
                    maxAlpha = Math.random() * 0.3 + 0.1; // 최대 조차도 흐릿함
                } else if (isEve) {
                    // 저녁: 따뜻한 주황빛 퍼짐과 어울리는 입자, 좌에서 우로 약간 번지듯 이동
                    size = Math.random() * 2.5 + 1;
                    speedX = Math.random() * 0.3 + 0.1; // 왼쪽에서 퍼져나가는 속도
                    speedY = (Math.random() - 0.5) * 0.2 - 0.05;
                    color = '255, ' + Math.floor(Math.random() * 100 + 120) + ', 50'; // 따뜻한 주황/노랑
                    twinkleSpeed = Math.random() * 0.01 + 0.005;
                    maxAlpha = Math.random() * 0.6 + 0.2;
                } else {
                    // 밤: 유지 (미세한 별빛)
                    size = Math.random() * 1.5;
                    speedX = (Math.random() - 0.5) * 0.1;
                    speedY = (Math.random() - 0.5) * 0.1;
                    color = '255, 255, 255';
                    twinkleSpeed = Math.random() * 0.02 + 0.005;
                    maxAlpha = Math.random() * 0.8 + 0.2;
                }
                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size, speedX, speedY, color, twinkleSpeed, maxAlpha,
                    alpha: Math.random() * maxAlpha,
                    alphaDir: Math.random() > 0.5 ? 1 : -1
                };
            }

            function drawParticles() {
                ctx.clearRect(0, 0, width, height);
                let isEve = currentHour >= 17 && currentHour < 20;

                particles.forEach(p => {
                    p.alpha += p.twinkleSpeed * p.alphaDir;
                    if (p.alpha > p.maxAlpha) { p.alpha = p.maxAlpha; p.alphaDir = -1; }
                    if (p.alpha < 0) { p.alpha = 0; p.alphaDir = 1; }

                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < -20) p.x = width + 20;
                    if (p.x > width + 20) p.x = -20;
                    if (p.y < -20) p.y = height + 20;
                    if (p.y > height + 20) p.y = -20;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';

                    // 저녁에는 자체 글로우 (은은한 퍼짐 극대화)
                    if (isEve) {
                        ctx.shadowBlur = p.size * 2;
                        ctx.shadowColor = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.fill();
                });
                requestAnimationFrame(drawParticles);
            }

            applyBodyTheme(currentHour);
            initParticles();
            drawParticles();

            setInterval(() => {
                let newHour = new Date().getHours();
                if (newHour !== currentHour) {
                    currentHour = newHour;
                    applyBodyTheme(currentHour);
                    initParticles();
                }
            }, 60000);
        })();
    </script>
