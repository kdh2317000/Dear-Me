    <style>
        /* [핵심 수정] 2. 전체 레이아웃: 높이 동기화를 위해 stretch 적용 */
        .main-wrapper {
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 50px auto !important;
            padding: 0 20px;
            align-items: stretch; /* 왼쪽 에디터와 오른쪽 사이드바 길이를 맞춤 */
        }

        /* 3. 공통 박스 스타일 */
        .content-box {
            background: white;
            border-radius: 30px;
            border: 3px solid #5c67f2;
            padding: 45px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* 4. 에디터 상세 스타일 */
        .editor-header { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .title-input { 
            width: 100%; border: none; font-size: 2.0rem; outline: none; 
            font-weight: bold; color: #333; font-family: inherit; padding: 10px 0;
            color-scheme: light !important;
            cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHBhdGggZD0iTTggMnYxMk01IDJoNk01IDE0aDYiIHN0cm9rZT0iYmxhY2siIHN0cm9rZS13aWR0aD0iMS41IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4=') 8 8, text !important;
        }
        .title-input::placeholder { color: #ccc; }

        .editor-toolbar { 
            display: flex; gap: 25px; padding: 15px 0; border-bottom: 1px solid #eee; 
            margin-bottom: 30px; color: #555; font-size: 1.2rem; align-items: center;
            position: relative;
        }
        .tool-item { 
            cursor: pointer; user-select: none; transition: 0.2s; padding: 5px; 
            border-radius: 5px; display: flex; align-items: center; justify-content: center; 
            position: relative; color: #555; 
        }
        
        .tool-item.active { color: #00c3ff !important; }
        .tool-item:hover { background: #f0f2ff; }

        /* 색상 팔레트 스타일 */
        .color-palette-bubble {
            display: none;
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 1000;
            width: 220px;
        }
        .color-palette-bubble.active { display: block; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .color-box { width: 34px; height: 34px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,0,0,0.05); }
        #colorIndicator { display: block; width: 100%; height: 4px; background-color: #5c67f2; margin-top: 1px; border-radius: 2px; }

        .content-editor {
            width: 100%; min-height: 448px; border: none; font-size: 1.35rem; 
            resize: none; outline: none; line-height: 2.1; font-family: inherit; color: #444;
            overflow-y: auto; text-align: left;
            flex: 1;
            caret-color: black !important;
            color-scheme: light !important;
            cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHBhdGggZD0iTTggMnYxMk01IDJoNk01IDE0aDYiIHN0cm9rZT0iYmxhY2siIHN0cm9rZS13aWR0aD0iMS41IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4=') 8 8, text !important;
        }
        .content-editor:empty:before { content: "여기에 당신의 진솔한 이야기를 남겨주세요..."; color: #ccc; }

        .attached-file-tag {
            display: inline-flex;
            align-items: center;
            background: #f1f3f5;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 1.0rem;
            margin: 5px 4px;
            border: 2px solid #dee2e6;
            cursor: default;
            user-select: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .attached-file-tag:hover { 
            background: #e7f5ff; 
            border-color: #5c67f2;
            transform: translateY(-2px);
        }
        .attached-file-tag a {
            color: #5c67f2 !important;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        .attached-file-tag i { margin-right: 8px; color: #5c67f2; }
        
        .delete-file-btn {
            margin-left: 8px; 
            cursor: pointer; 
            color: #ff5252; 
            font-weight: bold; 
            font-size: 1.1rem; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            background: #ffeaea; 
            vertical-align: middle;
            transition: 0.2s;
        }
        .delete-file-btn:hover {
            background: #ff5252;
            color: white;
        }

        .editor-footer { display: flex; justify-content: flex-end; gap: 20px; margin-top: 30px; }
        .btn-complete { 
            background: #00c3ff; color: white; border: none; padding: 16px 55px; 
            border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1.25rem; 
            transition: 0.3s;
        }
        .btn-complete:hover { background: #00a0d1; transform: translateY(-2px); }
        .btn-cancel {
            background: #f0f0f0; color: #666; padding: 16px 40px;
            border-radius: 15px; font-weight: bold; cursor: pointer; border: none;
            font-size: 1.25rem;
        }

        /* 5. 사이드바 실시간 인기글 스타일 */
        .sidebar { display: flex; flex-direction: column; }
        .side-title { 
            font-size: 1.2rem; font-weight: bold; padding-bottom: 12px; 
            border-bottom: 2px solid #5c67f2; margin-bottom: 15px; text-align: left;
        }
        .popular-list { list-style: none; padding: 0; margin: 0; text-align: left; }
        .popular-item {
            display: flex; gap: 12px; padding: 18px 0; border-bottom: 1px solid #f5f5f5;
            align-items: center; cursor: pointer; transition: 0.2s;
        }
        .popular-item:hover { padding-left: 5px; }
        .popular-item:hover .pop-text { color: #5c67f2; }
        .pop-num { color: #5c67f2; font-weight: 900; font-size: 1.1rem; width: 20px; }
        .pop-text { font-size: 1.05rem; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    </style>

<body>

</script>

    <div class="main-wrapper">
        <div class="content-box">
            <div class="editor-header">
                <input type="text" id="postTitle" class="title-input" placeholder="제목을 입력해주세요.">
                <div id="adminNoticeArea" style="display: none; margin-top: 15px;">
                    <label style="color: #ff5252; font-weight: bold; cursor: pointer;">
                        <input type="checkbox" id="isNoticeCheckbox" style="accent-color: #ff5252; transform: scale(1.2); margin-right: 5px;"> 📢 공지사항으로 등록
                    </label>
                </div>
            </div>
            
            <div class="editor-toolbar">
                <span class="tool-item" id="btn-bold" onmousedown="handleToolClick(event, 'bold')"><i class="fa-solid fa-bold"></i></span>
                <span class="tool-item" id="btn-underline" onmousedown="handleToolClick(event, 'underline')"><i class="fa-solid fa-underline"></i></span>
                <span class="tool-item" id="btn-strike" onmousedown="handleToolClick(event, 'strikeThrough')"><i class="fa-solid fa-strikethrough"></i></span>
                
                <div class="tool-item" onmousedown="event.preventDefault(); togglePalette(event);">
                    <div style="display: flex; flex-direction: column; align-items: center; pointer-events: none;">

                    <i class="fa-solid fa-caret-down" style="font-size: 0.7rem; margin-left: 5px; margin-top: -5px; pointer-events: none;"></i>

                            <div class="color-box" style="background: #e67e22;" onmousedown="handleColorClick(event, '#e67e22')"></div>

                            <div class="color-box" style="background: #27ae60;" onmousedown="handleColorClick(event, '#27ae60')"></div>
                            <div class="color-box" style="background: #00008B;" onmousedown="handleColorClick(event, '#00008B')"></div>
                            <div class="color-box" style="background: #ff66b2;" onmousedown="handleColorClick(event, '#ff66b2')"></div>
                            <div class="color-box" style="background: #808080;" onmousedown="handleColorClick(event, '#808080')"></div>
                            <div class="color-box" style="background: #e11d48;" onmousedown="handleColorClick(event, '#e11d48')"></div>
                            <div class="color-box" style="background: #0ea5e9;" onmousedown="handleColorClick(event, '#0ea5e9')"></div>
                            <div class="color-box" style="background: #8b5cf6;" onmousedown="handleColorClick(event, '#8b5cf6')"></div>

                </div>

    <script>
        const loginUser = sessionStorage.getItem('loginUser');
        const editor = document.getElementById('postContent');
        let selectedFileTag = null; 

        window.onload = function() {
            if(!loginUser) { alert("로그인이 필요합니다."); location.href = "/login"; return; }
            if(loginUser === 'admin' || loginUser === '관리자') {
                document.getElementById('adminNoticeArea').style.display = 'block';
            }
            loadPopularPosts(); // 페이지 로드 시 실제 인기글 로드
        };

        // [핵심] 실시간 인기글 로드 함수 (게시판 전체에서 조회수 순으로 추출)
        async function loadPopularPosts() {
            try {
                // 검색어 없이 전체 목록 요청
                const res = await fetch('/api/board/posts');
                const posts = await res.json();
                const popularList = document.getElementById('popularList');
                
                // 원글(parent_id가 없는 글)만 필터링 후 조회수 정렬 (공지사항 제외)
                const popularPosts = posts
                    .filter(p => !p.parent_id && !p.is_notice)
                    .sort((a, b) => (b.views || 0) - (a.views || 0))
                    .slice(0, 5);

                popularList.innerHTML = '';
                if(popularPosts.length === 0) {
                    popularList.innerHTML = '<li class="popular-item">글이 없습니다.</li>';
                    return;
                }

                popularPosts.forEach((p, index) => {
                    const li = document.createElement('li');
                    li.className = 'popular-item';
                    li.onclick = () => location.href = `/board/view/${p.id}`;
                    li.innerHTML = `
                        <span class="pop-num">${index + 1}</span>
                        <span class="pop-text">${p.title || '제목 없음'}</span>
                    `;
                    popularList.appendChild(li);
                });
            } catch (err) { console.error("인기글 로드 오류:", err); }
        }

        function handleToolClick(e, command) {
            e.preventDefault(); 
            document.execCommand(command, false, null);
            updateUI();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const fileName = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    const fileTag = `<span class="attached-file-tag" contenteditable="false"><a href="${imageUrl}"><i class="fa-solid fa-paperclip"></i>${fileName}</a><span class="delete-file-btn" onclick="this.parentElement.remove(); event.stopPropagation();">&times;</span></span>&nbsp;`;
                    
                    editor.focus();
                    document.execCommand('insertHTML', false, fileTag);
                    event.target.value = ''; 
                };
                reader.readAsDataURL(file);
            }
        }

        function selectFileTag(tag, e) {
            if (selectedFileTag) selectedFileTag.classList.remove('selected');
            selectedFileTag = tag;
            selectedFileTag.classList.add('selected');
            if (e) e.stopPropagation();
        }

        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedFileTag) {
                    e.preventDefault(); 
                    selectedFileTag.remove(); 
                    selectedFileTag = null;
                }
            }
        });

        function handleEditorClick(e) {
            const fileTag = e.target.closest('.attached-file-tag');
            if (fileTag) {
                const deleteBtn = e.target.closest('.delete-file-btn');
                if (!deleteBtn) {
                    e.preventDefault();
                    selectFileTag(fileTag, e);
                    
                    const aTag = fileTag.tagName === 'A' ? fileTag : fileTag.querySelector('a');
                    if (aTag) {
                        const imgData = aTag.getAttribute('href');
                        if (imgData) {
                            const viewer = window.open("");
                            viewer.document.write(`<html><body style="margin:0; background:#111; display:flex; justify-content:center; align-items:center; min-height:100vh;"><img src="${imgData}" style="max-width:100%; max-height:100vh; cursor:zoom-out;" onclick="window.close()"></body></html>`);
                        }
                    }
                }
            } else {
                if (selectedFileTag) {
                    selectedFileTag.classList.remove('selected');
                    selectedFileTag = null;
                }
            }
            updateUI();
        }

        function handleColorClick(e, color) {
            e.preventDefault(); e.stopPropagation();
            document.execCommand('foreColor', false, color);
            document.getElementById('colorIndicator').style.backgroundColor = color;
            document.getElementById('colorPalette').classList.remove('active');
            updateUI();
        }

        function togglePalette(e) { e.stopPropagation(); document.getElementById('colorPalette').classList.toggle('active'); }

        function handleLinkClick(e) {
            e.preventDefault();
            const url = prompt("연결할 링크 주소를 입력하세요:", "https://");
            if (url) document.execCommand('createLink', false, url);
        }

        function updateUI() {
            const actions = [{ id: 'btn-bold', cmd: 'bold' }, { id: 'btn-underline', cmd: 'underline' }, { id: 'btn-strike', cmd: 'strikeThrough' }];
            actions.forEach(action => {
                const isActive = document.queryCommandState(action.cmd);
                const btn = document.getElementById(action.id);
                if (btn) {
                    if (isActive) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });
        }

        document.addEventListener('click', (e) => {
            const palette = document.getElementById('colorPalette');
            if(palette && !e.target.closest('.tool-item')) {
                palette.classList.remove('active');
            }
        });

        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const content = editor.innerHTML; 
            const isNoticeCheckbox = document.getElementById('isNoticeCheckbox');
            const is_notice = isNoticeCheckbox && isNoticeCheckbox.checked ? true : false;

            if(!title.trim() || !content.trim() || content === '<br>') {
                alert("제목과 내용을 모두 입력해주세요!");
                return;
            }

            try {
                const res = await fetch('/api/board/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: loginUser, 
                        title: title, 
                        content: content,
                        is_notice: is_notice
                    })
                });
                
                const data = await res.json();
                if(data.success) {
                    alert("성공적으로 등록되었습니다! ✨");
                    location.href = "/board";
                } else {
                    alert("등록에 실패했습니다: " + (data.message || "서버 오류"));
                }
            } catch (err) {
                console.error("전송 에러:", err);
                alert("서버와 통신 중 오류가 발생했습니다.");
            }
        }

        function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) { sessionStorage.removeItem('loginUser'); location.href = "/login"; }
        }
    </script>


<!-- Global Auth Security & Heartbeat (Injected) -->
<script>
(function() {
    const u = sessionStorage.getItem('loginUser');
    if (u) {
        // 즉시 세션 유효성 검사 (서버 재실행 등 감지)
        fetch('/api/heartbeat?username=' + encodeURIComponent(u))
        .then(res => res.json())
        .then(data => {
            if(!data.success) {
                sessionStorage.removeItem('loginUser');
                alert("세션이 만료되었거나 서버가 재시작되었습니다. 다시 로그인해주세요.");
                location.href = "/login";
            }
        }).catch(()=>{});

        // 20초마다 생존 신고
        setInterval(() => {
            fetch('/api/heartbeat?username=' + encodeURIComponent(u))
            .then(res => res.json())
            .then(data => {
                if(!data.success) {
                    sessionStorage.removeItem('loginUser');
                    alert("세션이 만료되었습니다.");
                    location.href = "/login";
                }
            }).catch(()=>{});
        }, 3000);
    }
    window.logout = function() {
        if (confirm("로그아웃 하시겠습니까?")) {
            const currentUser = sessionStorage.getItem('loginUser');
            if (currentUser) {
                fetch('/api/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: currentUser})
                }).then(() => {
                    sessionStorage.removeItem('loginUser');
                    alert("정상적으로 로그아웃 되었습니다.");
                    location.href = "/";
                }).catch(() => {
                    sessionStorage.removeItem('loginUser');
                    location.href = "/";
                });
            } else {
                location.href = "/";
            }
        }
    };
})();
</script>










<!-- 시간대별 고급 파티클 테마 및 글로우 효과 -->
<canvas id="themeCanvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;"></canvas>
<script>
(function() {
    function applyBodyTheme(hour) {
        document.body.classList.remove('theme-morning', 'theme-evening', 'theme-night');
        if (hour >= 6 && hour < 17) {
            document.body.classList.add('theme-morning');
        } else if (hour >= 17 && hour < 20) {
            document.body.classList.add('theme-evening');
        } else {
            document.body.classList.add('theme-night');
        }
    }

    const canvas = document.getElementById('themeCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let currentHour = new Date().getHours();
    
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function initParticles() {
        particles = [];
        let count = 0;
        let isNight = currentHour >= 20 || currentHour < 6;
        let isEve = currentHour >= 17 && currentHour < 20;
        let isMorning = currentHour >= 6 && currentHour < 17;

        if (isMorning) count = 80; // 아침: 부유하는 먼지/햇살
        else if (isEve) count = 50; // 저녁: 따뜻한 주황빛 입자
        else count = 120; // 밤: 별처럼 많은 수 (기존 유지)

        for (let i = 0; i < count; i++) {
            particles.push(createParticle(isNight, isEve, isMorning));
        }
    }

    function createParticle(isNight, isEve, isMorning) {
        let size, speedX, speedY, color, twinkleSpeed, maxAlpha;
        if (isMorning) {
            // 아침: 먼지 느낌, 매우 연하고 작고 느리게 이동
            size = Math.random() * 1.5 + 0.5;
            speedX = (Math.random() - 0.5) * 0.15; // 좌우 아주 약간
            speedY = Math.random() * 0.2 + 0.05; // 부유하며 살짝 내려감
            color = '255, 255, 255'; 
            twinkleSpeed = Math.random() * 0.005 + 0.002;
            maxAlpha = Math.random() * 0.3 + 0.1; // 최대 조차도 흐릿함
        } else if (isEve) {
            // 저녁: 따뜻한 주황빛 퍼짐과 어울리는 입자, 좌에서 우로 약간 번지듯 이동
            size = Math.random() * 2.5 + 1;
            speedX = Math.random() * 0.3 + 0.1; // 왼쪽에서 퍼져나가는 속도
            speedY = (Math.random() - 0.5) * 0.2 - 0.05; 
            color = '255, ' + Math.floor(Math.random() * 100 + 120) + ', 50'; // 따뜻한 주황/노랑
            twinkleSpeed = Math.random() * 0.01 + 0.005;
            maxAlpha = Math.random() * 0.6 + 0.2;
        } else {
            // 밤: 유지 (미세한 별빛)
            size = Math.random() * 1.5;
            speedX = (Math.random() - 0.5) * 0.1;
            speedY = (Math.random() - 0.5) * 0.1;
            color = '255, 255, 255';
            twinkleSpeed = Math.random() * 0.02 + 0.005;
            maxAlpha = Math.random() * 0.8 + 0.2;
        }
        return { 
            x: Math.random() * width, 
            y: Math.random() * height, 
            size, speedX, speedY, color, twinkleSpeed, maxAlpha, 
            alpha: Math.random() * maxAlpha, 
            alphaDir: Math.random() > 0.5 ? 1 : -1 
        };
    }

    function drawParticles() {
        ctx.clearRect(0, 0, width, height);
        let isEve = currentHour >= 17 && currentHour < 20;

        particles.forEach(p => {
            p.alpha += p.twinkleSpeed * p.alphaDir;
            if (p.alpha > p.maxAlpha) { p.alpha = p.maxAlpha; p.alphaDir = -1; }
            if (p.alpha < 0) { p.alpha = 0; p.alphaDir = 1; }
            
            p.x += p.speedX;
            p.y += p.speedY;
            
            if (p.x < -20) p.x = width + 20;
            if (p.x > width + 20) p.x = -20;
            if (p.y < -20) p.y = height + 20;
            if (p.y > height + 20) p.y = -20;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
            
            // 저녁에는 자체 글로우 (은은한 퍼짐 극대화)
            if (isEve) {
                ctx.shadowBlur = p.size * 2;
                ctx.shadowColor = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.fill();
        });
        requestAnimationFrame(drawParticles);
    }

    applyBodyTheme(currentHour);
    initParticles();
    drawParticles();

    setInterval(() => {
        let newHour = new Date().getHours();
        if (newHour !== currentHour) {
            currentHour = newHour;
            applyBodyTheme(currentHour);
            initParticles();
        }
    }, 60000);
})();
</script>
