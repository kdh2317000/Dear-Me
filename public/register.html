<!DOCTYPE html>
<html lang="ko">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#5c67f2">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta charset="UTF-8">
    <title>Read US - 회원가입</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: #fff9c4;
            margin: 0;
            padding-top: 80px;
            font-family: sans-serif;
        }

        .register-box {
            background: white;
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 3px solid #a5d6a7;
            /* 회원가입은 초록빛 포인트 */
        }

        h2 {
            font-size: 2.8rem;
            color: #a5d6a7;
            margin-bottom: 35px;
        }

        input {
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 20px;
            background: #a5d6a7;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .link {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #666;
        }

        .link a {
            color: #5c67f2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
    <script src="/mobile-nav.js" defer></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <script>
        // 깜빡임 방지용 즉시 실행 테마 적용 (노란색 플래시 제거)
        (function () {
            var h = new Date().getHours();
            var c = (h >= 6 && h < 17) ? 'theme-morning' : (h >= 17 && h < 20) ? 'theme-evening' : 'theme-night';
            document.body.classList.add(c);
        })();
    </script>

    <div class="register-box">
        <h2>회원가입</h2>
        <form action="/register-process" method="POST">
            <input type="text" name="username" placeholder="사용할 아이디" required>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit">가입하기</button>
        </form>
        <div class="link">
            이미 계정이 있나요? <a href="/login">로그인하러 가기</a>
        </div>
    </div>


    <!-- Global Auth Security & Heartbeat (Injected) -->
    <script>
        (function () {
            const u = sessionStorage.getItem('loginUser');
            if (u) {
                // 즉시 세션 유효성 검사 (서버 재실행 등 감지)
                fetch('/api/heartbeat?username=' + encodeURIComponent(u))
                    .then(res => res.json())
                    .then(data => {
                        if (!data.success) {
                            sessionStorage.removeItem('loginUser');
                            alert("세션이 만료되었거나 서버가 재시작되었습니다. 다시 로그인해주세요.");
                            location.href = "/login";
                        }
                    }).catch(() => { });

                // 20초마다 생존 신고
                setInterval(() => {
                    fetch('/api/heartbeat?username=' + encodeURIComponent(u))
                        .then(res => res.json())
                        .then(data => {
                            if (!data.success) {
                                sessionStorage.removeItem('loginUser');
                                alert("세션이 만료되었습니다.");
                                location.href = "/login";
                            }
                        }).catch(() => { });
                }, 3000);
            }
            window.logout = function () {
                if (confirm("로그아웃 하시겠습니까?")) {
                    const currentUser = sessionStorage.getItem('loginUser');
                    if (currentUser) {
                        fetch('/api/logout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: currentUser })
                        }).then(() => {
                            sessionStorage.removeItem('loginUser');
                            alert("정상적으로 로그아웃 되었습니다.");
                            location.href = "/";
                        }).catch(() => {
                            sessionStorage.removeItem('loginUser');
                            location.href = "/";
                        });
                    } else {
                        location.href = "/";
                    }
                }
            };
        })();
    </script>









    <!-- 시간대별 고급 파티클 테마 및 글로우 효과 -->
    <canvas id="themeCanvas"
        style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;"></canvas>
    <script>
        (function () {
            function applyBodyTheme(hour) {
                document.body.classList.remove('theme-morning', 'theme-evening', 'theme-night');
                if (hour >= 6 && hour < 17) {
                    document.body.classList.add('theme-morning');
                } else if (hour >= 17 && hour < 20) {
                    document.body.classList.add('theme-evening');
                } else {
                    document.body.classList.add('theme-night');
                }
            }

            const canvas = document.getElementById('themeCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let currentHour = new Date().getHours();

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function initParticles() {
                particles = [];
                let count = 0;
                let isNight = currentHour >= 20 || currentHour < 6;
                let isEve = currentHour >= 17 && currentHour < 20;
                let isMorning = currentHour >= 6 && currentHour < 17;

                if (isMorning) count = 80; // 아침: 부유하는 먼지/햇살
                else if (isEve) count = 50; // 저녁: 따뜻한 주황빛 입자
                else count = 120; // 밤: 별처럼 많은 수 (기존 유지)

                for (let i = 0; i < count; i++) {
                    particles.push(createParticle(isNight, isEve, isMorning));
                }
            }

            function createParticle(isNight, isEve, isMorning) {
                let size, speedX, speedY, color, twinkleSpeed, maxAlpha;
                if (isMorning) {
                    // 아침: 먼지 느낌, 매우 연하고 작고 느리게 이동
                    size = Math.random() * 1.5 + 0.5;
                    speedX = (Math.random() - 0.5) * 0.15; // 좌우 아주 약간
                    speedY = Math.random() * 0.2 + 0.05; // 부유하며 살짝 내려감
                    color = '255, 255, 255';
                    twinkleSpeed = Math.random() * 0.005 + 0.002;
                    maxAlpha = Math.random() * 0.3 + 0.1; // 최대 조차도 흐릿함
                } else if (isEve) {
                    // 저녁: 따뜻한 주황빛 퍼짐과 어울리는 입자, 좌에서 우로 약간 번지듯 이동
                    size = Math.random() * 2.5 + 1;
                    speedX = Math.random() * 0.3 + 0.1; // 왼쪽에서 퍼져나가는 속도
                    speedY = (Math.random() - 0.5) * 0.2 - 0.05;
                    color = '255, ' + Math.floor(Math.random() * 100 + 120) + ', 50'; // 따뜻한 주황/노랑
                    twinkleSpeed = Math.random() * 0.01 + 0.005;
                    maxAlpha = Math.random() * 0.6 + 0.2;
                } else {
                    // 밤: 유지 (미세한 별빛)
                    size = Math.random() * 1.5;
                    speedX = (Math.random() - 0.5) * 0.1;
                    speedY = (Math.random() - 0.5) * 0.1;
                    color = '255, 255, 255';
                    twinkleSpeed = Math.random() * 0.02 + 0.005;
                    maxAlpha = Math.random() * 0.8 + 0.2;
                }
                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size, speedX, speedY, color, twinkleSpeed, maxAlpha,
                    alpha: Math.random() * maxAlpha,
                    alphaDir: Math.random() > 0.5 ? 1 : -1
                };
            }

            function drawParticles() {
                ctx.clearRect(0, 0, width, height);
                let isEve = currentHour >= 17 && currentHour < 20;

                particles.forEach(p => {
                    p.alpha += p.twinkleSpeed * p.alphaDir;
                    if (p.alpha > p.maxAlpha) { p.alpha = p.maxAlpha; p.alphaDir = -1; }
                    if (p.alpha < 0) { p.alpha = 0; p.alphaDir = 1; }

                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < -20) p.x = width + 20;
                    if (p.x > width + 20) p.x = -20;
                    if (p.y < -20) p.y = height + 20;
                    if (p.y > height + 20) p.y = -20;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';

                    // 저녁에는 자체 글로우 (은은한 퍼짐 극대화)
                    if (isEve) {
                        ctx.shadowBlur = p.size * 2;
                        ctx.shadowColor = 'rgba(' + p.color + ', ' + Math.max(p.alpha, 0) + ')';
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.fill();
                });
                requestAnimationFrame(drawParticles);
            }

            applyBodyTheme(currentHour);
            initParticles();
            drawParticles();

            setInterval(() => {
                let newHour = new Date().getHours();
                if (newHour !== currentHour) {
                    currentHour = newHour;
                    applyBodyTheme(currentHour);
                    initParticles();
                }
            }, 60000);
        })();
    </script>

</body>

</html>
