<script>
// ── 유틸 ──
const $ = id => document.getElementById(id);
const emotionLabel = { joy:'😊 기쁨', sadness:'😭 슬픔', worry:'😟 고민', anger:'😡 화남', lonely:'👤 외로움', lethargy:'😴 무기력', anxiety:'😰 불안', flutter:'💕 설렘' };
const emotionBadge = e => `<span class="badge badge-${e}">${emotionLabel[e]||e}</span>`;
const fmtDate = s => s ? new Date(s).toLocaleDateString('ko-KR') : '-';
const stripHtml = s => s ? s.replace(/<[^>]*>/g,'').substring(0, 60) : '';

function toast(msg, type='success') {
    const el = $('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    setTimeout(() => el.className = '', 2500);
}

async function api(url, opts={}) {
    const headers = { 'Content-Type':'application/json', 'x-admin-user': 'admin', ...(opts.headers||{}) };
    const res = await fetch(url, { ...opts, headers });
    return res.json();
}

// ── 페이지 전환 ──
const loaders = { 'system-quotes': loadSystemQuotes, 'custom-quotes': loadCustomQuotes, 'fortune-cookies': loadFortuneCookies, 'users': loadUsers, 'board-posts': loadBoardPosts, 'feedbacks': loadFeedbacks };
let loaded = {};

function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    $(`page-${name}`).classList.add('active');
    el.classList.add('active');
    if (!loaded[name]) { loaded[name] = true; loaders[name](); }
}

// ── ① 시스템 명언 ──
async function loadSystemQuotes() {
    const emotion = $('sq-filter').value;
    const url = '/api/admin/system-quotes' + (emotion ? `?emotion=${emotion}` : '');
    const data = await api(url);
    $('sq-count').textContent = data.length + '개';
    if (!data.length) { $('sq-table').innerHTML = '<tr><td colspan="5" class="empty">데이터 없음</td></tr>'; return; }
    $('sq-table').innerHTML = data.map(r => `
        <tr>
            <td style="color:var(--text2)">${r.id}</td>
            <td>${emotionBadge(r.emotion)}</td>
            <td>${r.text}</td>
            <td style="color:var(--text2)">${r.author}</td>
            <td class="td-actions">
                <button class="btn btn-edit" onclick="openEdit(${r.id},'${r.emotion}',${JSON.stringify(r.text)},${JSON.stringify(r.author)})">수정</button>
                <button class="btn btn-danger btn-sm" onclick="delSystemQuote(${r.id})">삭제</button>
            </td>
        </tr>`).join('');
}

async function addSystemQuote() {
    const emotion = $('sq-emotion').value;
    const text = $('sq-text').value.trim();
    const author = $('sq-author').value.trim();
    if (!text || !author) { toast('내용과 작가를 모두 입력해주세요.', 'error'); return; }
    const res = await api('/api/admin/system-quotes', { method:'POST', body: JSON.stringify({emotion, text, author}) });
    if (res.success) { toast('명언이 추가됐어요!'); $('sq-text').value=''; $('sq-author').value=''; loaded['system-quotes']=false; loadSystemQuotes(); }
    else toast(res.error, 'error');
}

async function delSystemQuote(id) {
    if (!confirm('이 명언을 삭제할까요?')) return;
    const res = await api(`/api/admin/system-quotes/${id}`, {method:'DELETE'});
    if (res.success) { toast('삭제됐어요!'); loadSystemQuotes(); }
    else toast(res.error, 'error');
}

// 수정 모달
function openEdit(id, emotion, text, author) {
    $('edit-id').value = id;
    $('edit-emotion').value = emotion;
    $('edit-text').value = text;
    $('edit-author').value = author;
    $('editModal').classList.add('open');
}
function closeModal() { $('editModal').classList.remove('open'); }

async function saveEdit() {
    const id = $('edit-id').value;
    const emotion = $('edit-emotion').value;
    const text = $('edit-text').value.trim();
    const author = $('edit-author').value.trim();
    if (!text || !author) { toast('모두 입력해주세요.', 'error'); return; }
    const res = await api(`/api/admin/system-quotes/${id}`, { method:'PUT', body: JSON.stringify({emotion, text, author}) });
    if (res.success) { toast('수정됐어요!'); closeModal(); loadSystemQuotes(); }
    else toast(res.error, 'error');
}
$('editModal').addEventListener('click', e => { if(e.target===$('editModal')) closeModal(); });
